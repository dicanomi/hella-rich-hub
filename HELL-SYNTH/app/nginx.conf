server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Long-cache immutable build assets
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Everything else falls through to index.html (hash routing needs no
  # rewrites, but this keeps direct loads of / and unknown paths working)
  location / {
    try_files $uri $uri/ /index.html;
  }
}
