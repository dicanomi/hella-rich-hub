<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <title>Ratioclub Round 4</title>
    <link rel="icon" type="image/png" sizes="64x64" href="/ratioclub/favicon.png" />
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #000;
      }

      main {
        width: 100%;
        height: 100vh;
        height: 100dvh;
        background: #000;
      }

      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        background: #000;
      }
    </style>
  </head>
  <body>
    <main aria-label="Ratioclub presentation">
      <iframe
        title="Ratioclub logos round 4 — Figma presentation"
        src="https://www.figma.com/embed?embed_host=share&amp;url=https%3A%2F%2Fwww.figma.com%2Fdeck%2FMR224Xsn93NjpBhC5slSZH%2FRatioclub-logos-round-4%3Fnode-id%3D55-10%26scaling%3Dmin-zoom%26content-scaling%3Dfixed%26page-id%3D0%253A1"
        width="800"
        height="450"
        allow="autoplay https://embed.figma.com https://www.figma.com https://figma.com; fullscreen https://embed.figma.com https://www.figma.com https://figma.com"
        allowfullscreen
      ></iframe>
    </main>
    <script>
      const presentation = document.querySelector("iframe");
      presentation.addEventListener("load", () => presentation.focus());
    </script>
  </body>
</html>
