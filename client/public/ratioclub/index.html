<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000"><title>Ratioclub Round 4</title><link rel="icon" href="/ratioclub/favicon.png"><style>
html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Arial,sans-serif}main{height:100vh;height:100dvh;display:grid;place-items:center}img,video{display:block;width:100%;height:100%;object-fit:contain}nav{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;background:#222b;border-radius:4px;padding:4px 8px;font-size:12px}button{border:0;background:transparent;color:#fff;cursor:pointer;font-size:16px;padding:2px 5px}button:disabled{opacity:.3}#play{position:fixed;inset:45% auto auto 50%;transform:translate(-50%,-50%);background:#222;padding:12px 18px;border-radius:4px}#play[hidden]{display:none}
</style></head><body><main aria-label="Ratioclub presentation"></main><button id="play" hidden>Play video</button><nav aria-label="Presentation controls"><button id="prev" aria-label="Previous slide">‹</button><span id="count" aria-live="polite"></span><button id="next" aria-label="Next slide">›</button><button id="restart" aria-label="Restart presentation">↻</button><button id="fullscreen" aria-label="Full screen">⛶</button></nav><script>
const main=document.querySelector('main'),count=document.querySelector('#count'),prev=document.querySelector('#prev'),next=document.querySelector('#next'),play=document.querySelector('#play');
const assetBase=new URL('assets/',location.origin+location.pathname.replace(/(?:index\.html)?\/?$/,'/'));
const videos=new Set([8,15,22,29,36]);let slide=1,active;
function show(n){if(n<1||n>41)return;if(active instanceof HTMLVideoElement)active.pause();slide=n;const media=document.createElement(videos.has(n)?'video':'img');active=media;play.hidden=true;if(media instanceof HTMLVideoElement){media.muted=true;media.defaultMuted=true;media.autoplay=true;media.loop=true;media.playsInline=true;media.preload='auto';media.setAttribute('aria-label',`Slide ${n} animated logo`);}else{media.alt=`Ratioclub Round 4, slide ${n}`;}media.src=new URL(`slide-${n}.${videos.has(n)?'mp4':'png'}`,assetBase).href;main.replaceChildren(media);count.textContent=`${n} / 41`;prev.disabled=n===1;next.disabled=n===41;if(media instanceof HTMLVideoElement)media.play().catch(()=>{if(active===media)play.hidden=false;});for(const ahead of [n+1,n-1]){if(ahead>0&&ahead<=41&&!videos.has(ahead)){const image=new Image();image.src=new URL(`slide-${ahead}.png`,assetBase).href;}}}
prev.onclick=()=>show(slide-1);next.onclick=()=>show(slide+1);document.querySelector('#restart').onclick=()=>show(1);play.onclick=()=>{if(active instanceof HTMLVideoElement)active.play().then(()=>play.hidden=true).catch(()=>{});};document.querySelector('#fullscreen').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.();};document.addEventListener('keydown',e=>{if(e.altKey||e.metaKey||e.ctrlKey)return;const moves={ArrowRight:1,ArrowDown:1,PageDown:1,' ':1,ArrowLeft:-1,ArrowUp:-1,PageUp:-1};if(e.key in moves){e.preventDefault();show(slide+moves[e.key]);}else if(e.key==='Home'){e.preventDefault();show(1);}else if(e.key==='End'){e.preventDefault();show(41);}});show(1);
</script></body></html>
